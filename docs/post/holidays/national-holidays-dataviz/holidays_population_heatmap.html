<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Number of people observing a national holiday</title>
<style>
:root { --ink: #1a1a1a; --cell-font: 16px; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body {
  background: #ffffff;
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
.page {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 14px 20px;
}
h1 {
  flex: 0 0 auto;
  font-size: 26px; line-height: 1.2; font-weight: 700;
  text-align: center; margin: 0 0 32px; max-width: 680px;
}
.grid {
  flex: 1 1 auto;
  min-height: 0;
  width: 100%;
  max-width: 680px;
  max-height: 780px;
  display: grid;
  grid-template-columns: 36px repeat(12, 1fr);
  grid-template-rows: auto repeat(31, 1fr);
  gap: 3px;
  background: #ffffff;
}
.month {
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700; color: var(--ink);
  line-height: 1;
}
.day {
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 6px; font-size: 20px; color: var(--ink);
  line-height: 1;
}
.cell {
  display: flex; align-items: center; justify-content: center;
  padding-top: 2px;
  font-size: var(--cell-font); color: #2d2d2d; background: #ffffff;
  line-height: 1;
}
.cell.live { cursor: default; }
.cell.live:hover { box-shadow: inset 0 0 0 2px rgba(0,0,0,.35); }
.month, .day, .cell { min-height: 0; }
#tip {
  position: fixed; left: 0; top: 0; z-index: 20;
  pointer-events: none; opacity: 0;
  background: #000000; color: #ffffff;
  padding: 12px 16px; border-radius: 8px;
  font-size: 18px; font-weight: 500; line-height: 1.4; white-space: nowrap;
  box-shadow: 0 6px 24px rgba(0,0,0,.45);
  transition: opacity .07s ease;
}
#tip .dim { opacity: .72; }
@media (max-width: 520px) {
  .grid { grid-template-columns: 24px repeat(12, 1fr); }
  .day { font-size: 9px; padding-right: 2px; }
  .month { font-size: 9px; }
  .cell { font-size: 9px; }
  h1 { font-size: 20px; }
}
</style>
</head>

const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const nf = new Intl.NumberFormat("en-US");
function fmtPop(v){
  if (v >= 1e9){ var s = (v/1e9).toFixed(1); s = s.replace(/\.0$/,""); return s + "B"; }
  if (v >= 1e6) return Math.floor(v/1e6) + "M";
  if (v >= 1e3) return Math.floor(v/1e3) + "K";
  return String(v);
}
var grid = document.getElementById("grid");
var tip = document.getElementById("tip");

var corner = document.createElement("div");
corner.className = "corner";
grid.appendChild(corner);
DATA.months.forEach(function(m){
  var d = document.createElement("div");
  d.className = "month";
  d.textContent = m;
  grid.appendChild(d);
});

DATA.cells.forEach(function(row, di){
  var dl = document.createElement("div");
  dl.className = "day";
  dl.textContent = DATA.days[di];
  grid.appendChild(dl);
  row.forEach(function(c, mi){
    var el = document.createElement("div");
    if (c.v == null) {
      el.className = "cell";
    } else {
      el.className = "cell live";
      el.style.background = c.fill;
      if (c.label) {
        el.textContent = c.label;
        el.style.color = c.text;
      }
      el.addEventListener("mousemove", function(e){ moveTip(e, di, mi, c.v); });
      el.addEventListener("mouseleave", hideTip);
    }
    grid.appendChild(el);
  });
});

function moveTip(e, di, mi, v){
  var date = MONTHS[mi] + " " + DATA.days[di];
  var html = "<b>" + date + "</b><br>";
  if (DATA.unit === "countries") {
    html += nf.format(v) + " countries";
  } else {
    html += nf.format(v) + " people";
  }
  tip.innerHTML = html;
  tip.style.opacity = "1";
  var pad = 14;
  var x = e.clientX + pad, y = e.clientY + pad;
  var r = tip.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
  tip.style.left = x + "px";
  tip.style.top = y + "px";
}
function hideTip(){ tip.style.opacity = "0"; }
