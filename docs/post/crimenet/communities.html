<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRIMENET · Communities (3D)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/3d-force-graph"></script>

<style>
:root {
  --bg:#07080a; --s1:#0d1117; --s2:#111820; --s3:#161e2c;
  --b1:#1a2535; --b2:#243347; --b3:#2e4060;
  --amber:#e8a020; --amber2:#b87818; --amber3:#3d2a06;
  --green:#2db87d; --red:#d63b3b;
  --text:#bdd0e8; --text2:#56708a; --text3:#2c3f58;
  --body:'Inter',sans-serif; --disp:'Oswald',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--body);font-size:20px}

/* SCANLINES */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9000;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.04) 2px,rgba(0,0,0,.04) 4px)}

/* TOPBAR */
#topbar{
  position:fixed;top:0;left:0;right:0;height:90px;z-index:400;
  background:rgba(7,8,10,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--b1);
  display:flex;align-items:stretch;
}
.tb-logo{display:flex;align-items:center;gap:14px;padding:0 24px;border-right:1px solid var(--b1);flex-shrink:0}
.tb-mark{font-family:var(--disp);font-size:30px;letter-spacing:2px;line-height:1;color:var(--amber);text-shadow:0 0 18px rgba(232,160,32,.3);text-transform:uppercase}
.tb-sub{font-size:13px;letter-spacing:2px;font-weight:600;color:var(--text2);text-transform:uppercase;margin-top:3px}

.tb-stats{display:flex}
.tb-stat{display:flex;flex-direction:column;justify-content:center;padding:0 24px;border-right:1px solid var(--b1)}
.tb-val{font-family:var(--disp);font-size:42px;color:var(--amber);line-height:1}
.tb-lbl{font-size:13px;font-weight:600;letter-spacing:1px;color:var(--text3);text-transform:uppercase;margin-top:3px}

.tb-right{display:flex;align-items:center;gap:12px;padding:0 20px;border-left:1px solid var(--b1);margin-left:auto;flex-shrink:0}
.tb-btn{padding:8px 18px;background:none;border:1px solid var(--b1);color:var(--text2);font-family:var(--body);font-weight:600;font-size:16px;letter-spacing:1px;cursor:pointer;border-radius:4px;transition:all .12s;text-transform:uppercase;white-space:nowrap;}
.tb-btn:hover{color:var(--text);border-color:var(--b2)}

#graph-wrap{position:fixed;inset:0;top:90px;outline:none}

/* LEGEND */
#legend{
  position:fixed;left:20px;bottom:20px;z-index:300;
  background:rgba(13,17,23,.92);backdrop-filter:blur(8px);
  border:1px solid var(--b1);border-radius:8px;padding:14px 18px;min-width:340px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
}
#legend .lg-title{font-size:13px;letter-spacing:2px;color:var(--text3);text-transform:uppercase;font-weight:700;margin-bottom:8px}
#legend .lg-row{display:flex;align-items:center;gap:11px;padding:5px 0}
#legend .lg-swatch{width:12px;height:12px;border-radius:50%;flex-shrink:0}
#legend .lg-name{font-size:15px;color:var(--text);font-weight:600;flex:1;line-height:1.25}
#legend .lg-count{font-size:15px;color:var(--text2);font-weight:700;font-family:var(--disp)}

/* LOADER */
#loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:20px}
.ld-logo{font-family:var(--disp);font-size:96px;letter-spacing:8px;color:var(--amber);text-shadow:0 0 40px rgba(232,160,32,.4)}
.ld-msg{font-size:16px;font-weight:600;letter-spacing:2px;color:var(--text2);text-transform:uppercase}
.ld-bar{width:280px;height:3px;background:var(--b1);border-radius:2px;overflow:hidden}
.ld-fill{height:100%;background:var(--amber);width:0;transition:width .3s}
.ld-err{color:#d63b3b;font-size:18px;text-align:center;line-height:1.9;display:none;max-width:450px}

/* 3D Force Graph Tooltip Restyling */
.scene-tooltip {
  background: var(--s2) !important;
  border: 1px solid var(--b2) !important;
  border-radius: 4px !important;
  padding: 12px 16px !important;
  box-shadow: 0 6px 20px rgba(0,0,0,.5) !important;
  pointer-events: none;
  transform: translate(-50%, 25px);
  color: var(--text) !important;
}
.tt-name { font-family:var(--disp); font-size:30px; color:var(--amber); letter-spacing:1px; line-height:1.1; text-transform:uppercase; }
.tt-type { font-size:14px; font-weight:600; letter-spacing:1px; color:var(--text3); text-transform:uppercase; margin-top:5px; }
</style>
</head>
<body>

<div id="loader">
  <div class="ld-logo">CRIMENET</div>
  <div class="ld-msg" id="ld-msg">Loading…</div>
  <div class="ld-bar"><div class="ld-fill" id="ld-fill"></div></div>
  <div class="ld-err" id="ld-err"></div>
</div>

<div id="topbar">
  <div class="tb-logo">
    <div>
      <div class="tb-mark">CRIMENET</div>
      <div class="tb-sub">Communities</div>
    </div>
  </div>

  <div class="tb-stats">
    <div class="tb-stat"><div class="tb-val" id="s-orgs">—</div><div class="tb-lbl">Orgs shown</div></div>
    <div class="tb-stat"><div class="tb-val" id="s-edges">—</div><div class="tb-lbl">Edges shown</div></div>
    <div class="tb-stat"><div class="tb-val" id="s-comms">—</div><div class="tb-lbl">Clusters</div></div>
  </div>

  <div class="tb-right">
    <div style="display:flex; align-items:center; gap: 12px;">
      <button class="tb-btn" id="btn-orbit" style="color:var(--amber);border-color:var(--amber)">Orbit: ON</button>
      <div style="display:flex; align-items:center; gap: 8px;" title="Orbit Speed">
        <span style="font-size: 12px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 0.5px;">Speed</span>
        <input type="range" id="orbit-speed" min="0.1" max="5" step="0.1" value="2.0" style="width: 80px; accent-color: var(--amber); cursor: pointer;">
      </div>
    </div>
    <button class="tb-btn" id="btn-fit">Fit Camera</button>
  </div>
</div>

<div id="graph-wrap"></div>

<div id="legend"></div>

<script>
// ═══════════════════════════════════════════
// Community color model
// Highlighted communities keep their own color at full opacity; everything
// else falls back to a dim steel so the clusters pop.
// ═══════════════════════════════════════════
const OTHER_COLOR = '#637f99';

function hexToRgba(hex, alpha) {
  let h = (hex || '#ffffff').replace('#', '');
  if (h.length === 3) h = h.split('').map(c=>c+c).join('');
  const r = parseInt(h.substring(0,2), 16) || 0;
  const g = parseInt(h.substring(2,4), 16) || 0;
  const b = parseInt(h.substring(4,6), 16) || 0;
  return `rgba(${r},${g},${b},${alpha})`;
}

const tick = () => new Promise(r=>setTimeout(r,0));

let Graph;
let commColors = {};      // commId -> color (from data.communities)
let commTitles = {};      // commId -> title

async function init() {
  const setLD = (t,p) => {
    document.getElementById('ld-msg').textContent = t;
    document.getElementById('ld-fill').style.width = p+'%';
  };
  try {
    setLD('Fetching communities…',15);
    const res = await fetch('data/communities_figure.json');
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    setLD('Parsing…',40); const data = await res.json(); await tick();
    setLD('Rendering…',80);

    const nodes = data.nodes || [];
    const links = data.edges || [];
    const communities = data.communities || {};

    Object.entries(communities).forEach(([id, c]) => {
      commColors[+id] = c.color;
      commTitles[+id] = c.title;
    });

    buildLegend(nodes, communities);
    buildGraph(nodes, links);

    await new Promise(r => setTimeout(r, 600));
    document.getElementById('loader').style.display = 'none';
  } catch(e) {
    document.getElementById('ld-err').style.display = 'block';
    document.getElementById('ld-err').innerHTML = `⚠ Cannot load <code>data/communities_figure.json</code><br>Check that the data/ directory is deployed alongside this page.<br><small style="color:#3a5060">${e.message}</small>`;
    document.getElementById('ld-msg').style.display='none';
    document.getElementById('ld-fill').parentElement.style.display='none';
  }
}

function buildLegend(nodes, communities) {
  const otherCount = nodes.filter(n => !n.highlight).length;
  const fmt = n => Number(n).toLocaleString();

  let html = '<div class="lg-title">Communities</div>';
  Object.values(communities).forEach(c => {
    html += `<div class="lg-row">
      <span class="lg-swatch" style="background:${c.color};box-shadow:0 0 12px ${c.color}"></span>
      <span class="lg-name">${escHtml(c.title)}</span>
      <span class="lg-count">${fmt(c.size)}</span>
    </div>`;
  });
  html += `<div class="lg-row">
    <span class="lg-swatch" style="background:${OTHER_COLOR}"></span>
    <span class="lg-name">Other organizations</span>
    <span class="lg-count">${fmt(otherCount)}</span>
  </div>`;
  document.getElementById('legend').innerHTML = html;
}

function buildGraph(nodes, links) {
  const wrap = document.getElementById('graph-wrap');

  Graph = ForceGraph3D({ controlType: 'orbit' })(wrap)
    .graphData({ nodes, links })
    .nodeId('id')
    .backgroundColor('#07080a')
    .enableNodeDrag(false)
    .nodeOpacity(0.99)
    .linkOpacity(0.99)
    .nodeVal(node => node.highlight
      ? Math.max(2.2, Math.sqrt(node.deg || 1) * 1.8)
      : Math.max(1.2, Math.sqrt(node.deg || 1) * 1.0))
    .nodeResolution(12)
    .nodeColor(node => node.highlight
      ? hexToRgba(node.color || OTHER_COLOR, 0.95)
      : hexToRgba(OTHER_COLOR, 0.16))
    .linkWidth(0)
    .linkColor(link => {
      const color = link.u_comm >= 0 ? (commColors[link.u_comm] || OTHER_COLOR) : OTHER_COLOR;
      const alpha = link.u_comm >= 0 ? 0.32 : 0.05;
      return hexToRgba(color, alpha);
    })
    .nodeLabel(node => {
      const comm = node.highlight ? (commTitles[node.comm] || '') : '';
      const typeStr = comm || 'Other organizations';
      return `<div class="tt-name">${escHtml(node.id)}</div><div class="tt-type">${escHtml(typeStr)}</div>`;
    });

  Graph.cameraPosition({ z: 1600 });

  Graph.d3Force('charge').strength(-140);
  Graph.d3Force('link').distance(35);

  // Small graph (350 nodes / ~1.1k links) — a short settle is enough; keep the
  // animation loop driving the layout so the page never blocks.
  Graph.d3AlphaDecay(0.02);
  Graph.d3VelocityDecay(0.35);
  Graph.warmupTicks(0);
  Graph.cooldownTime(15000);

  const controls = Graph.controls();
  controls.panSpeed = 1.5;
  controls.zoomSpeed = 1.5;

  document.getElementById('s-orgs').textContent = Number(nodes.length).toLocaleString();
  document.getElementById('s-edges').textContent = Number(links.length).toLocaleString();
  document.getElementById('s-comms').textContent = Object.keys(commColors).length;

  document.getElementById('btn-fit').addEventListener('click', () => {
    Graph.zoomToFit(800, 50);
  });

  // Orbit camera
  let isOrbiting = true;
  let orbitReq = null;
  let orbitAngle = 0;
  let orbitSpeedMult = 2.0;
  const baseSpeed = Math.PI / 360;

  function orbitLoop() {
    if (!isOrbiting) return;
    const pos = Graph.cameraPosition();
    const distance = Math.hypot(pos.x, pos.z);
    Graph.cameraPosition({
      x: distance * Math.sin(orbitAngle),
      z: distance * Math.cos(orbitAngle),
      y: pos.y
    });
    orbitAngle += baseSpeed * orbitSpeedMult;
    orbitReq = requestAnimationFrame(orbitLoop);
  }

  function startOrbit() {
    if (!Graph) return;
    const pos = Graph.cameraPosition();
    orbitAngle = Math.atan2(pos.x, pos.z);
    orbitReq = requestAnimationFrame(orbitLoop);
  }

  document.getElementById('btn-orbit').addEventListener('click', (e) => {
    isOrbiting = !isOrbiting;
    const btn = e.target;
    if (isOrbiting) {
      btn.textContent = 'Orbit: ON';
      btn.style.color = 'var(--amber)';
      btn.style.borderColor = 'var(--amber)';
      startOrbit();
    } else {
      btn.textContent = 'Orbit: OFF';
      btn.style.color = '';
      btn.style.borderColor = '';
      if (orbitReq) cancelAnimationFrame(orbitReq);
    }
  });

  document.getElementById('orbit-speed').addEventListener('input', (e) => {
    orbitSpeedMult = parseFloat(e.target.value);
  });

  window.addEventListener('resize', () => {
    Graph.width(wrap.clientWidth).height(wrap.clientHeight);
  });

  startOrbit();
}

function escHtml(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

init();
</script>
</body>
</html>
